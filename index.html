<!DOCTYPE html>
<html>
<head>
<title>PixGlobal</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
position:absolute;
}

#menuBtn{
position:fixed;
top:15px;
left:15px;
width:40px;
cursor:pointer;
z-index:2000;
}

#menuBtn div{
height:4px;
background:white;
margin:6px 0;
}

#menu{
position:fixed;
top:60px;
left:15px;
background:white;
border-radius:8px;
padding:10px;
display:none;
z-index:2000;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="menuBtn">
<div></div><div></div><div></div>
</div>

<div id="menu">
<div>Settings</div>
<div>About</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const WORLD_W = 8192;
const WORLD_H = 4096;

/* 🌍 GERÇEK HARİTA */
const map = new Image();
map.src = "https://tile.openstreetmap.org/0/0/0.png"; // başlangıç tile

let scale = 1;
let camX = 0, camY = 0;

let dragging = false;
let lx, ly;

/* TILE SİSTEMİ */
function drawTiles() {
  const tileSize = 256;

  const zoom = Math.floor(scale + 2); // zoom seviyesi
  const maxTiles = Math.pow(2, zoom);

  const startX = Math.floor(-camX / (tileSize * scale));
  const startY = Math.floor(-camY / (tileSize * scale));

  const endX = startX + Math.ceil(canvas.width / (tileSize * scale)) + 2;
  const endY = startY + Math.ceil(canvas.height / (tileSize * scale)) + 2;

  for (let x = startX; x < endX; x++) {
    for (let y = startY; y < endY; y++) {

      let tx = ((x % maxTiles) + maxTiles) % maxTiles;
      let ty = ((y % maxTiles) + maxTiles) % maxTiles;

      const img = new Image();
      img.src = `https://tile.openstreetmap.org/${zoom}/${tx}/${ty}.png`;

      ctx.drawImage(
        img,
        x * tileSize * scale + camX,
        y * tileSize * scale + camY,
        tileSize * scale,
        tileSize * scale
      );
    }
  }
}

/* DRAW */
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

drawTiles();
}

/* ZOOM */
canvas.addEventListener("wheel",(e)=>{
e.preventDefault();
scale += e.deltaY * -0.001;
scale = Math.min(Math.max(0.5, scale), 6);
});

/* DRAG */
canvas.addEventListener("mousedown",(e)=>{
dragging = true;
lx = e.clientX;
ly = e.clientY;
});

canvas.addEventListener("mouseup",()=>dragging=false);

canvas.addEventListener("mousemove",(e)=>{
if(!dragging)return;

camX += e.clientX - lx;
camY += e.clientY - ly;

lx = e.clientX;
ly = e.clientY;
});

/* LOOP */
function loop(){
draw();
requestAnimationFrame(loop);
}

loop();

/* MENU */
const menuBtn = document.getElementById("menuBtn");
const menu = document.getElementById("menu");

menuBtn.onclick = ()=>{
menu.style.display = menu.style.display==="block"?"none":"block";
};
</script>

</body>
</html>
