<!DOCTYPE html>
<html>
<head>
<title>PixGlobal</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
position:absolute;
}

#menuBtn{
position:fixed;
top:15px;
left:15px;
width:40px;
cursor:pointer;
z-index:2000;
}

#menuBtn div{
height:4px;
background:black;
margin:6px 0;
}

#menu{
position:fixed;
top:60px;
left:15px;
background:white;
border:2px solid black;
border-radius:8px;
padding:10px;
display:none;
z-index:2000;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="menuBtn">
<div></div><div></div><div></div>
</div>

<div id="menu">
<div>Settings</div>
<div>About</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io(window.location.origin);

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const pixelSize=10;
const WORLD = 800;

let pixels={};
let selectedColor="#000";

/* 🌍 ARKA PLAN DÜNYA */
const worldBg = new Image();
worldBg.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/World_map_-_low_resolution.svg/2000px-World_map_-_low_resolution.svg.png";

socket.on("init",(serverPixels)=>{
pixels = serverPixels;
});

socket.on("pixelUpdate",({x,y,color})=>{
pixels[x+","+y]=color;
});

let scale=1;
let targetScale=1;

let camX=0,camY=0;
let targetCamX=0,targetCamY=0;

/* DRAW */
function draw(){

ctx.setTransform(1,0,0,1,0,0);
ctx.fillStyle="#d0d0d0";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.setTransform(scale,0,0,scale,camX,camY);

/* 🌍 dünya arka plan (şeffaf) */
ctx.globalAlpha = 0.25;
ctx.drawImage(worldBg, 0, 0, WORLD*pixelSize, WORLD*pixelSize);
ctx.globalAlpha = 1;

/* BEYAZ OYUN ALANI */
ctx.fillStyle="white";
ctx.fillRect(0,0,WORLD*pixelSize,WORLD*pixelSize);

/* BORDER */
ctx.strokeStyle="black";
ctx.lineWidth=6;
ctx.strokeRect(0,0,WORLD*pixelSize,WORLD*pixelSize);

/* GRID */
if(scale>=1.3){
ctx.strokeStyle="rgba(0,0,0,0.08)";
ctx.lineWidth=1;

for(let x=0;x<=WORLD;x++){
ctx.beginPath();
ctx.moveTo(x*pixelSize,0);
ctx.lineTo(x*pixelSize,WORLD*pixelSize);
ctx.stroke();
}

for(let y=0;y<=WORLD;y++){
ctx.beginPath();
ctx.moveTo(0,y*pixelSize);
ctx.lineTo(WORLD*pixelSize,y*pixelSize);
ctx.stroke();
}
}

/* PIXELS */
for(let k in pixels){
let[x,y]=k.split(",");
ctx.fillStyle=pixels[k];
ctx.fillRect(x*pixelSize,y*pixelSize,pixelSize,pixelSize);
}
}

/* CLICK */
canvas.addEventListener("click",(e)=>{
const rect=canvas.getBoundingClientRect();

let x=Math.floor((e.clientX-rect.left-camX)/scale/pixelSize);
let y=Math.floor((e.clientY-rect.top-camY)/scale/pixelSize);

if(x<0||y<0||x>=WORLD||y>=WORLD)return;

pixels[x+","+y]=selectedColor;

socket.emit("placePixel",{x,y,color:selectedColor});
});

/* ZOOM */
canvas.addEventListener("wheel",(e)=>{
e.preventDefault();
targetScale+=e.deltaY*-0.001;
targetScale=Math.min(Math.max(0.5,targetScale),6);
});

/* DRAG */
let dragging=false,lx,ly;

canvas.addEventListener("mousedown",(e)=>{
dragging=true;
lx=e.clientX;
ly=e.clientY;
});

canvas.addEventListener("mouseup",()=>dragging=false);

canvas.addEventListener("mousemove",(e)=>{
if(!dragging)return;

targetCamX+=e.clientX-lx;
targetCamY+=e.clientY-ly;

lx=e.clientX;
ly=e.clientY;
});

/* UPDATE */
function update(){
scale+=(targetScale-scale)*0.15;
camX+=(targetCamX-camX)*0.12;
camY+=(targetCamY-camY)*0.12;
}

/* LOOP */
function loop(){
update();
draw();
requestAnimationFrame(loop);
}

loop();

/* MENU */
const menuBtn=document.getElementById("menuBtn");
const menu=document.getElementById("menu");

menuBtn.onclick=()=>{
menu.style.display=menu.style.display==="block"?"none":"block";
};
</script>

</body>
</html>
