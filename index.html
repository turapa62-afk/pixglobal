<!DOCTYPE html>
<html>
<head>
<title>PixGlobal v6 FULL MULTIPLAYER</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

#bgOutside{
position:fixed;
width:100%;
height:100%;
background:#d0d0d0;
z-index:0;
}

#loadingScreen{
position:fixed;
width:100%;
height:100%;
z-index:50;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background: radial-gradient(circle at center, red 0%, black 70%);
}

#logo{
font-size:42px;
color:white;
font-weight:bold;
}

#sub{
color:#ddd;
margin-top:10px;
}

#bar{
width:320px;
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
margin-top:20px;
}

#progress{
width:0%;
height:100%;
background:red;
animation:load 3s forwards;
}

@keyframes load{
to{width:100%;}
}

canvas{
position:absolute;
z-index:2;
}

#timer{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;
padding:8px 14px;
border-radius:8px;
z-index:1000;
}

#palette{
position:fixed;
bottom:70px;
right:20px;
background:white;
border:2px solid black;
padding:10px;
border-radius:10px;
z-index:1000;
}

#paletteBtn{
position:fixed;
bottom:20px;
right:20px;
background:black;
color:white;
border:none;
padding:10px;
border-radius:8px;
z-index:1000;
}

#menuBtn{
position:fixed;
top:15px;
left:15px;
width:40px;
cursor:pointer;
z-index:2000;
}

#menuBtn div{
height:4px;
background:black;
margin:6px 0;
}

#menu{
position:fixed;
top:60px;
left:15px;
background:white;
border:2px solid black;
border-radius:8px;
padding:10px;
display:none;
z-index:2000;
}

.menuItem{
padding:6px;
cursor:pointer;
}

.menuItem:hover{
background:#eee;
}
</style>
</head>

<body>

<div id="bgOutside"></div>

<div id="loadingScreen">
<div id="logo">PIXGLOBAL</div>
<div id="sub">loading world...</div>
<div id="bar"><div id="progress"></div></div>
</div>

<canvas id="canvas"></canvas>

<div id="timer">GO</div>

<div id="palette">
<input type="color" id="colorInput">
</div>

<button id="paletteBtn">Colors</button>

<div id="menuBtn">
<div></div><div></div><div></div>
</div>

<div id="menu">
<div class="menuItem">Settings</div>
<div class="menuItem">About</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDG7E4QVqlIX9DyJf7VaEgKYD4H4GL6BCg",
  authDomain: "pixglobal-ca240.firebaseapp.com",
  projectId: "pixglobal-ca240",
  storageBucket: "pixglobal-ca240.appspot.com",
  messagingSenderId: "97362633894",
  appId: "1:97362633894:web:445ade72da24cf319cc067"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ref = doc(db, "pixglobal", "world");

let pixels = {};

/* REALTIME SYNC */
onSnapshot(ref, (snap) => {
  if (snap.exists()) {
    pixels = snap.data().pixels || {};
  }
});

/* SAVE PIXEL */
window.placePixel = async (x, y, color) => {
  pixels[x + "," + y] = color;

  await setDoc(ref, {
    pixels: pixels
  });
};
</script>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

ctx.imageSmoothingEnabled=false;

const pixelSize=10;
const WORLD=2000;

let selectedColor="#000";

document.getElementById("colorInput").oninput=(e)=>{
selectedColor=e.target.value;
};

function getMouse(e){
const r=canvas.getBoundingClientRect();
return {
x:e.clientX-r.left,
y:e.clientY-r.top
};
}

function draw(){
ctx.setTransform(1,0,0,1,0,0);
ctx.fillStyle="#d0d0d0";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let k in pixels){
let[x,y]=k.split(",");
ctx.fillStyle=pixels[k];
ctx.fillRect(x*pixelSize,y*pixelSize,pixelSize,pixelSize);
}
}

canvas.addEventListener("click",(e)=>{
const m=getMouse(e);

let x=Math.floor(m.x/pixelSize);
let y=Math.floor(m.y/pixelSize);

placePixel(x,y,selectedColor);
});

function loop(){
draw();
requestAnimationFrame(loop);
}

loop();

setTimeout(()=>{
document.getElementById("loadingScreen").style.display="none";
document.getElementById("bgOutside").style.display="none";
},3000);
</script>

</body>
</html>
