<!DOCTYPE html>
<html>
<head>
<title>PixGlobal v6 FULL STABLE</title>

<style>
body{margin:0;overflow:hidden;font-family:Arial;background:black;}

#bgOutside{position:fixed;width:100%;height:100%;background:#d0d0d0;z-index:0;}

#loadingScreen{
position:fixed;width:100%;height:100%;z-index:50;
display:flex;justify-content:center;align-items:center;flex-direction:column;
background:radial-gradient(circle at center,red 0%,black 70%);
}

#logo{font-size:42px;color:white;font-weight:bold;}
#sub{color:#ddd;margin-top:10px;}

canvas{position:absolute;z-index:2;}

#timer{
position:fixed;bottom:20px;left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;padding:8px 14px;border-radius:8px;
z-index:1000;
}

#palette{position:fixed;bottom:70px;right:20px;background:white;padding:10px;border-radius:10px;display:none;z-index:1000;}
#paletteBtn{position:fixed;bottom:20px;right:20px;background:black;color:white;padding:10px;border-radius:8px;z-index:1000;}

</style>
</head>

<body>

<div id="bgOutside"></div>

<div id="loadingScreen">
<div id="logo">PIXGLOBAL</div>
<div id="sub">loading world...</div>
</div>

<canvas id="canvas"></canvas>

<div id="timer">30</div>

<div id="palette">
<input type="color" id="colorInput">
</div>

<button id="paletteBtn">Colors</button>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const pixelSize=10;
const WORLD=2000;

/* TEK STATE */
let pixels={};
let selectedColor="#000";

/* FIREBASE (minimal) */
import("https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js").then(async (firebase)=>{

const { initializeApp } = firebase;
const { getFirestore, doc, setDoc, onSnapshot } =
await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js");

const app = initializeApp({
apiKey:"AIzaSyDG7E4QVqlIX9DyJf7VaEgKYD4H4GL6BCg",
authDomain:"pixglobal-ca240.firebaseapp.com",
projectId:"pixglobal-ca240",
storageBucket:"pixglobal-ca240.appspot.com",
messagingSenderId:"97362633894",
appId:"1:97362633894:web:445ade72da24cf319cc067"
});

const db=getFirestore(app);
const ref=doc(db,"pixglobal","world");

/* REALTIME */
onSnapshot(ref,(snap)=>{
if(snap.exists()){
pixels = snap.data().pixels || {};
}
});

/* SAVE */
window.placePixel=async(x,y,color)=>{
pixels[x+","+y]=color;
await setDoc(ref,{pixels});
};

});

/* UI */
document.getElementById("colorInput").oninput=(e)=>{
selectedColor=e.target.value;
};

document.getElementById("paletteBtn").onclick=()=>{
let p=document.getElementById("palette");
p.style.display=p.style.display==="block"?"none":"block";
};

/* DRAW */
function draw(){
ctx.setTransform(1,0,0,1,0,0);
ctx.fillStyle="white";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let k in pixels){
let[x,y]=k.split(",");
ctx.fillStyle=pixels[k];
ctx.fillRect(x*pixelSize,y*pixelSize,pixelSize,pixelSize);
}
}

/* CLICK */
canvas.addEventListener("click",(e)=>{
const x=Math.floor(e.clientX/pixelSize);
const y=Math.floor(e.clientY/pixelSize);

placePixel(x,y,selectedColor);
});

/* LOOP */
function loop(){
draw();
requestAnimationFrame(loop);
}
loop();

setTimeout(()=>{
document.getElementById("loadingScreen").style.display="none";
},2000);

</script>

</body>
</html>
