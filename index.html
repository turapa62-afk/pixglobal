<!DOCTYPE html>
<html>
<head>
<title>PixGlobal V2</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:#d0d0d0;
}

canvas{
position:absolute;
}

#timer{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;
padding:8px 14px;
border-radius:8px;
}

#paletteBtn{
position:fixed;
bottom:20px;
right:20px;
background:black;
color:white;
padding:10px;
border-radius:8px;
}

#colorInput{
position:fixed;
bottom:70px;
right:20px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="timer">Ready</div>

<input type="color" id="colorInput">
<button id="paletteBtn">Color</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io();

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const WORLD = 800;
const pixelSize = 10;

let pixels = {};
let selectedColor = "#000";

let canPlace = true;
let time = 0;
let interval;

// ===== SOCKET =====
socket.on("init", (data) => {
  pixels = data;
});

socket.on("pixelUpdate", (d) => {
  pixels[d.x + "," + d.y] = d.color;
});

// ===== UI =====
document.getElementById("colorInput").oninput = (e) => {
  selectedColor = e.target.value;
};

document.getElementById("paletteBtn").onclick = () => {
  let el = document.getElementById("colorInput");
  el.style.display = el.style.display === "none" ? "block" : "none";
};

// ===== COOLDOWN FIX =====
function startCooldown(){
  time = 3;
  canPlace = false;

  clearInterval(interval);

  interval = setInterval(() => {
    time--;
    document.getElementById("timer").innerText = time;

    if(time <= 0){
      canPlace = true;
      document.getElementById("timer").innerText = "Ready";
      clearInterval(interval);
    }
  },1000);
}

// ===== DRAW =====
function draw(){
  ctx.fillStyle = "#d0d0d0";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let k in pixels){
    let [x,y] = k.split(",");
    ctx.fillStyle = pixels[k];
    ctx.fillRect(x*pixelSize, y*pixelSize, pixelSize, pixelSize);
  }
}

// ===== CLICK =====
canvas.addEventListener("click",(e)=>{
  if(!canPlace) return;

  let x = Math.floor(e.clientX / pixelSize);
  let y = Math.floor(e.clientY / pixelSize);

  if(x<0||y<0||x>=WORLD||y>=WORLD) return;

  pixels[x+","+y] = selectedColor;

  socket.emit("placePixel",{
    x,y,
    color:selectedColor
  });

  startCooldown();
});

// ===== LOOP =====
function loop(){
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
