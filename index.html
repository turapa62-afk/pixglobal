<!DOCTYPE html>
<html>
<head>
<title>PixGlobal</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

canvas{
position:absolute;
z-index:2;
}

#timer{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;
padding:8px 14px;
border-radius:8px;
z-index:1000;
}

#paletteBtn{
position:fixed;
bottom:20px;
right:20px;
z-index:1000;
padding:10px;
background:black;
color:white;
border:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="timer">Ready</div>

<button id="paletteBtn">Color</button>
<input type="color" id="colorInput" style="display:none;position:fixed;bottom:60px;right:20px;z-index:1000;">

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io();

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const WORLD = 800;
const pixelSize = 10;

let pixels = {};
let selectedColor = "#000000";

let myPixelCount = 0;
const MAX_PIXELS = 50;

let canPlace = true;
let time = 0;
let timer = document.getElementById("timer");
let interval;

// INIT WORLD
socket.on("init",(data)=>{
pixels = data;
});

// UPDATE PIXEL
socket.on("pixelUpdate",(data)=>{
pixels[`${data.x},${data.y}`] = data.color;
});

// DRAW
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";
ctx.fillRect(0,0,WORLD*pixelSize,WORLD*pixelSize);

for(let k in pixels){
let [x,y]=k.split(",");
ctx.fillStyle=pixels[k];
ctx.fillRect(x*pixelSize,y*pixelSize,pixelSize,pixelSize);
}
}

// CLICK
canvas.addEventListener("click",(e)=>{

if(!canPlace) return;

if(myPixelCount >= MAX_PIXELS){
timer.innerText = "50 limit doldu!";
return;
}

let x = Math.floor(e.clientX / pixelSize);
let y = Math.floor(e.clientY / pixelSize);

if(x<0||y<0||x>=WORLD||y>=WORLD) return;

socket.emit("placePixel",{x,y,color:selectedColor});

myPixelCount++;

startCooldown();
});

// COOLDOWN
function startCooldown(){
canPlace = false;
time = 1;

if(interval) clearInterval(interval);

interval = setInterval(()=>{
time--;

if(time <= 0){
canPlace = true;
timer.innerText = "Go Pixel!";
clearInterval(interval);
}
},1000);
}

// COLOR
document.getElementById("paletteBtn").onclick=()=>{
let c=document.getElementById("colorInput");
c.style.display = c.style.display==="block"?"none":"block";
};

document.getElementById("colorInput").oninput=(e)=>{
selectedColor = e.target.value;
};

// LOOP
function loop(){
draw();
requestAnimationFrame(loop);
}

loop();

socket.on("connect",()=>{
myPixelCount = 0;
startCooldown();
});
</script>

</body>
</html>
