<!DOCTYPE html>
<html>
<head>
<title>PixGlobal v6 FULL STABLE</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

#bgOutside{
position:fixed;
width:100%;
height:100%;
background:#d0d0d0;
z-index:0;
}

#loadingScreen{
position:fixed;
width:100%;
height:100%;
z-index:50;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background: radial-gradient(circle at center, red 0%, black 70%);
}

#logo{
font-size:42px;
color:white;
font-weight:bold;
}

#sub{
color:#ddd;
margin-top:10px;
}

#bar{
width:320px;
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
margin-top:20px;
}

#progress{
width:0%;
height:100%;
background:red;
animation:load 3s forwards;
}

@keyframes load{
to{width:100%;}
}

canvas{
position:absolute;
z-index:2;
}

#timer{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;
padding:8px 14px;
border-radius:8px;
z-index:1000;
}

#palette{
position:fixed;
bottom:70px;
right:20px;
background:white;
border:2px solid black;
padding:10px;
border-radius:10px;
display:none;
z-index:1000;
}

#paletteBtn{
position:fixed;
bottom:20px;
right:20px;
background:black;
color:white;
border:none;
padding:10px;
border-radius:8px;
z-index:1000;
}

#menuBtn{
position:fixed;
top:15px;
left:15px;
width:40px;
cursor:pointer;
z-index:2000;
}

#menuBtn div{
height:4px;
background:black;
margin:6px 0;
}

#menu{
position:fixed;
top:60px;
left:15px;
background:white;
border:2px solid black;
border-radius:8px;
padding:10px;
display:none;
z-index:2000;
}

.menuItem{
padding:6px;
cursor:pointer;
}

.menuItem:hover{
background:#eee;
}
</style>
</head>

<body>

<div id="bgOutside"></div>

<div id="loadingScreen">
<div id="logo">PIXGLOBAL</div>
<div id="sub">loading world...</div>
<div id="bar"><div id="progress"></div></div>
</div>

<canvas id="canvas"></canvas>

<div id="timer">30</div>

<div id="palette">
<input type="color" id="colorInput">
</div>

<button id="paletteBtn">Colors</button>

<div id="menuBtn">
<div></div><div></div><div></div>
</div>

<div id="menu">
<div class="menuItem">Settings</div>
<div class="menuItem">About</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDG7E4QVqlIX9DyJf7VaEgKYD4H4GL6BCg",
  authDomain: "pixglobal-ca240.firebaseapp.com",
  projectId: "pixglobal-ca240",
  storageBucket: "pixglobal-ca240.appspot.com",
  messagingSenderId: "97362633894",
  appId: "1:97362633894:web:445ade72da24cf319cc067"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "pixglobal", "world");

let pixels = {};

onSnapshot(ref,(snap)=>{
if(snap.exists()){
pixels = snap.data().pixels || {};
}
});

window.placePixel = async (x,y,color)=>{
pixels[x+","+y]=color;
await setDoc(ref,{pixels});
};
</script>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

ctx.imageSmoothingEnabled=false;

const pixelSize=10;
const WORLD=2000;

let selectedColor="#000";

let scale=1;
let targetScale=1;

let camX=0,camY=0;
let targetCamX=0,targetCamY=0;

let canPlace=false;
let time=30;
let timer=document.getElementById("timer");
let interval;

function startCooldown(){
time=30;
canPlace=false;

if(interval)clearInterval(interval);

interval=setInterval(()=>{
time--;
timer.innerText=time;

if(time<=0){
canPlace=true;
timer.innerText="GO";
clearInterval(interval);
}
},1000);
}

document.getElementById("colorInput").oninput=(e)=>{
selectedColor=e.target.value;
};

document.getElementById("paletteBtn").onclick=()=>{
let p=document.getElementById("palette");
p.style.display=p.style.display==="block"?"none":"block";
};

const menuBtn=document.getElementById("menuBtn");
const menu=document.getElementById("menu");

menuBtn.onclick=()=>{
menu.style.display=menu.style.display==="block"?"none":"block";
};

function getMouse(e){
const r=canvas.getBoundingClientRect();
return{
x:e.clientX-r.left,
y:e.clientY-r.top
};
}

function draw(){
ctx.setTransform(1,0,0,1,0,0);
ctx.fillStyle="#d0d0d0";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.setTransform(scale,0,0,scale,camX,camY);

ctx.fillStyle="white";
ctx.fillRect(0,0,WORLD*pixelSize,WORLD*pixelSize);

ctx.strokeStyle="black";
ctx.lineWidth=6;
ctx.strokeRect(0,0,WORLD*pixelSize,WORLD*pixelSize);

for(let k in pixels){
let[x,y]=k.split(",");
ctx.fillStyle=pixels[k];
ctx.fillRect(x*pixelSize,y*pixelSize,pixelSize,pixelSize);
}
}

canvas.addEventListener("click",(e)=>{
if(!canPlace)return;

const m=getMouse(e);

let x=Math.floor((m.x-camX)/scale/pixelSize);
let y=Math.floor((m.y-camY)/scale/pixelSize);

placePixel(x,y,selectedColor);

startCooldown();
});

canvas.addEventListener("wheel",(e)=>{
e.preventDefault();
targetScale+=e.deltaY*-0.001;
targetScale=Math.min(Math.max(0.5,targetScale),6);
});

let dragging=false,lx,ly;

canvas.addEventListener("mousedown",(e)=>{
dragging=true;
lx=e.clientX;
ly=e.clientY;
});

canvas.addEventListener("mouseup",()=>dragging=false);

canvas.addEventListener("mousemove",(e)=>{
if(!dragging)return;

targetCamX+=e.clientX-lx;
targetCamY+=e.clientY-ly;

lx=e.clientX;
ly=e.clientY;
});

function update(){
scale+=(targetScale-scale)*0.15;
camX+=(targetCamX-camX)*0.12;
camY+=(targetCamY-camY)*0.12;
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

setTimeout(()=>{
document.getElementById("loadingScreen").style.display="none";
document.getElementById("bgOutside").style.display="none";
startCooldown();
},3000);

loop();
</script>

</body>
</html>
